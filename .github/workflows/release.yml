# Every merge to main is a release: tests, then static binaries for
# linux/amd64 and linux/arm64, SHA256SUMS and a build provenance
# attestation, published as GitHub release v<VERSION>.<n> (see
# .github/next-version.sh). `atl update` installs a release only when its
# attestation says it was built by this workflow from refs/heads/main:
# keep this file's path and the branch in step with internal/update.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE

permissions: {}

# One release at a time (each numbers itself from the tags before it);
# merges that land meanwhile are released together by the next run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to number the release
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing cached
      - name: Version
        id: version
        run: |
          echo "tag=$(.github/next-version.sh)" >> "$GITHUB_OUTPUT"
          echo "prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -buildmode=exe -trimpath \
              -ldflags="-s -w -X github.com/andreujuanc/atelier/internal/version.Version=$TAG" \
              -o "dist/atl-linux-$arch" ./cmd/atl
          done
          test "$(dist/atl-linux-amd64 version)" = "$TAG"
          (cd dist && sha256sum atl-linux-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atl-linux-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          notes="Install or update: \`atl update\` (or \`U\` in the TUI)."
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" HEAD -- Dockerfile build-images; then
            notes="$notes

          **The task image changed:** rebuild it after updating (\`ATL_BUILD_BOX=0 ./build-images\` in your build clone)."
          fi
          set -- --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "$notes"
          if [ -n "$PREV" ]; then set -- "$@" --notes-start-tag "$PREV"; fi
          gh release create "$TAG" dist/* "$@"
