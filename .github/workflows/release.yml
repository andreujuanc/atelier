# Every merge to main is a release: tests, then static binaries for
# linux/amd64 and linux/arm64, SHA256SUMS, its signature SHA256SUMS.sig
# and a build provenance attestation, published as GitHub release
# v<VERSION>.<n> (see .github/next-version.sh). `atl update` installs a
# release only when SHA256SUMS.sig checks out with the public key built
# into atl (internal/update/release-key.pub). The private key is the
# secret RELEASE_SIGNING_KEY of the "release" environment, which only
# main may deploy to (README: Releases).
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE

permissions: {}

# One release at a time (each numbers itself from the tags before it);
# merges that land meanwhile are released together by the next run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-24.04
    # Holds the secret RELEASE_SIGNING_KEY. Its deployment branch rule
    # admits main only: no other branch's workflow gets the key.
    environment: release
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to number the release
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing cached
      - name: Version
        id: version
        run: |
          echo "tag=$(.github/next-version.sh)" >> "$GITHUB_OUTPUT"
          echo "prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -buildmode=exe -trimpath \
              -ldflags="-s -w -X github.com/andreujuanc/atelier/internal/version.Version=$TAG" \
              -o "dist/atl-linux-$arch" ./cmd/atl
          done
          test "$(dist/atl-linux-amd64 version)" = "$TAG"
          (cd dist && sha256sum atl-linux-* > SHA256SUMS && cat SHA256SUMS)
      - name: Sign
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in the release environment (README: Releases)"; exit 1
          fi
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          .github/sign-release.sh "$key" "$TAG" dist/SHA256SUMS dist/SHA256SUMS.sig internal/update/release-key.pub
          rm -f "$key"
      # Not what atl checks (that is the signature), but anyone can check
      # it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atl-linux-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          notes="Install or update: \`atl update\` (or \`U\` in the TUI)."
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" HEAD -- Dockerfile build-images; then
            notes="$notes

          **The task image changed:** rebuild it after updating (\`ATL_BUILD_BOX=0 ./build-images\` in your build clone)."
          fi
          set -- --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "$notes"
          if [ -n "$PREV" ]; then set -- "$@" --notes-start-tag "$PREV"; fi

          # A draft until every asset is up: no one sees a half-made release.
          # A run that failed midway leaves its draft behind: start over
          # (never touching a published release).
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft "$@"
          # An upload whose answer was lost succeeded anyway: retrying it
          # must replace the asset (--clobber), not fail on its name.
          for f in dist/*; do
            n=0
            until gh release upload "$TAG" "$f" --clobber; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "upload $f failed $n times"; exit 1; fi
              sleep 10
            done
          done
          gh release edit "$TAG" --draft=false --latest
